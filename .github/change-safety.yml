version: 1

changes:
  code: allowed
  tests: allowed
  documentation: allowed

  dependency: restricted
  api: restricted
  database: restricted
  architecture: restricted
  configuration: restricted
  security: restricted
  ci_cd: restricted
  infrastructure: restricted
  generated: restricted
  git: restricted
  unknown: restricted

  destructive: forbidden
  history_rewrite: forbidden
  secret_access: forbidden

# CI 連携時に利用する想定のパス定義（初期値）
forbidden_paths:
  - ".env"
  - ".env.production"
  - "secrets/**"

restricted_paths:
  - ".github/workflows/**"
  - "migrations/**"
  - "infra/**"
  - "terraform/**"

# Completion Gate 設定
completion:
  enabled: true
  require_acceptance_criteria_check: true
  require_validation_result: true
  require_safety_check: true
  require_completion_report: true
