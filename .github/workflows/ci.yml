name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Repository Structure Validation
  # ──────────────────────────────────────────────
  repository-validation:
    name: Repository Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository Structure Validation
        run: bash scripts/validate/validate-repository.sh

  # ──────────────────────────────────────────────
  # Documentation & Markdown Validation
  # ──────────────────────────────────────────────
  documentation-validation:
    name: Documentation Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Documentation Validation
        run: bash scripts/validate/validate-docs.sh

  # ──────────────────────────────────────────────
  # API Contract Validation
  # ──────────────────────────────────────────────
  contract-validation:
    name: Contract Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Contract Validation
        run: bash scripts/validate/validate-contracts.sh

  # ──────────────────────────────────────────────
  # Format Check
