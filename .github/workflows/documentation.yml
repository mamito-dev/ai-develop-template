name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "**.md"
      - ".github/instructions/**"
      - ".github/prompts/**"
      - "AGENTS.md"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "**.md"

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Markdown & Broken Link Validation
  # ──────────────────────────────────────────────
  markdown-validation:
    name: Markdown & Link Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Documentation Validation
        run: bash scripts/validate/validate-docs.sh

  # ──────────────────────────────────────────────
  # markdownlint（利用可能な場合）
  # ──────────────────────────────────────────────
  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: |
          markdownlint \
            --ignore node_modules \
            --ignore ".git" \
            "**/*.md" || {
            echo ""
            echo "Command: markdownlint **/*.md"
            echo "Action: 上記のエラーを修正してください。"
            echo "参考: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md"
            exit 1
          }
